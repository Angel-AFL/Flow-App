flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#101B2B"

  adaptive_icon_background: "#101B2B"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/branding/app_icon_monochrome.png"

  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#101B2B"
    theme_color: "#58CC02"

  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/branding/app_icon_macos.png"
